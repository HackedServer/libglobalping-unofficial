[tool.poetry]
name = "libglobalping-unofficial"
version = "0.2.0"
description = "Unofficial library for the GlobalPing API"
authors = ["HackedServer"]
readme = "README.md"
packages = [{include = "libglobalping"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.27.0,<1.0.0"
pydantic = ">=2.0.0,<3.0.0"

[tool.poetry.dev-dependencies]
black = "*"
isort = "*"
pytest = ">=7.0.0,<9.0.0"
pytest-asyncio = ">=0.23.0,<1.0.0"
respx = ">=0.21.0,<1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
